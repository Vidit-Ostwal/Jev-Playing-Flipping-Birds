[project]
name = "jev-playing-flipping-birds"
version = "0.1.0"
description = "TypeSafe Jev plays Flappy Bird with a live web spectator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "flappy-bird-gymnasium>=0.4.0",
    "pillow>=11.0.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "typesafe-sdk>=0.7.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false
